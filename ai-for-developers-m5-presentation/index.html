	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};


        </script>

> You wouldn't drive cross-country to buy milk. Same rule for AI.

<!-- .element: class="fragment" data-fragment-index="1" -->

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="2">Every completion reads your <strong>full context window</strong></li>
<li class="fragment" data-fragment-index="3">Long chats, big diffs, and whole-repo dumps add up fast</li>
<li class="fragment" data-fragment-index="4">Optimization = <strong>same outcome, fewer tokens</strong></li>
</ul>

### ⛽ Your tank is not infinite

| What fills the tank                         | Why it hurts              |
| ------------------------------------------- | ------------------------- |
| Chat history + tool outputs                 | Re-sent on every turn     |
| Rules, skills, MCP tool schemas             | Fixed overhead each run   |
| Pasted logs, full files, `@Codebase` sweeps | Easy to 10× a simple ask  |
| Wrong model tier for a simple task          | Pay premium price for nothing |

<!-- .element: style="font-size: 2.0rem" -->

> 📌 **Rule:** if you can't list what's in context — you're packing too much.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="1" -->

notes:

Покажіть usage dashboard у Cursor (Settings → Usage) або просто згадайте типовий сценарій «токени закінчились на другий день». Аудиторія має відчути, що це не абстракція.

Task: _Login returns 401 after token refresh_

Count what travels with **every** message in this repo:

<ul style="font-size: 2.0rem">

| Signal                              | Route                          |
| ----------------------------------- | ------------------------------ |
| Rename, format, small diff, typo    | **Fast / default**             |
| Feature work, refactor, multi-file  | **Balanced / Agent default**   |
| Architecture, subtle bugs, security | **Thinking / premium tier**    |
| Sensitive data, offline, repetitive | **Local model**                |

<!-- .element: style="font-size: 2.0rem" -->

> 📌 **Rule:** upgrade the engine only when the road gets rough.

### 🛠️ Task → model → mode (copy this)

| Your task | Model | Mode | Why |
| --------- | ----- | ---- | --- |
| "Where is `refreshToken` handled?" | Auto / fast | **Ask** | Read-only, no edit loop |
| Rename prop across 4 files | Auto / fast | **Agent** | Simple change, low risk |
| Add OAuth + refresh flow (6+ files) | Balanced or top-tier | **Plan → Agent** | Planning is cheap; Agent stays focused |
| Flaky prod bug, can't reproduce locally | Top-tier | **Debug** | Live evidence is worth the higher price |
| Generate 20 CRUD stubs from OpenAPI | **Local** (Ollama) | Agent | High volume + private; you check the diffs |

> Narrow, relevant context beats the whole project — every time.

<!-- .element: class="fragment" data-fragment-index="1" -->

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="2">Pack only what the Agent needs for <strong>this</strong> task</li>
<li class="fragment" data-fragment-index="3">Say what "done" looks like — skip the essay</li>
</ul>

### ✍️ Prompts that don't waste fuel

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1"><strong>One job per message</strong> — split "implement + test + docs"</li>
<li class="fragment" data-fragment-index="2"><strong>State the limits first</strong> — files, patterns, what's out of scope</li>
<li class="fragment" data-fragment-index="3"><strong>Examples &gt; adjectives</strong> — show one good diff, not "make it clean"</li>
<li class="fragment" data-fragment-index="4"><strong>Reference, don't paste</strong> — `@file`, `@folder`, `@Docs`</li>
</ul>

> 📌 **Rule:** specific beats polite. "Fix login 401 in `auth.ts`" beats a paragraph of praise.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="5" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

**🔴 burns tokens**

<!-- prettier-ignore -->
```text
You are a world-class senior engineer. Our login is broken.
Please investigate the entire authentication system, fix all
related issues, add tests, update docs, and refactor if needed.

```text
401 after refresh — repro: login → wait 15m → click Profile.

Done when: existing auth.test.ts passes; no new deps.
```

### 🗺️ Plan before you implement

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1"><strong>Clarify</strong> — goal, constraints, acceptance criteria</li>
<li class="fragment" data-fragment-index="2"><strong>Check</strong> — files touched, risks, dependencies</li>
<li class="fragment" data-fragment-index="3"><strong>Approve the plan</strong> — then switch to Agent</li>
</ul>

> 🎯 **Best for:** anything beyond a one-file tweak.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->

notes:

Live demo idea: одна й та сама задача — спочатку Agent одразу (багато tool calls), потім Plan → короткий Agent run. Порівняйте відчуття і кількість кроків.

### 🎬 Plan mode — click path

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Mode picker → <strong>Plan</strong> (or accept when Cursor suggests it)</li>
<li class="fragment" data-fragment-index="2">Agent explores read-only → asks 1–3 clarifying questions</li>
<li class="fragment" data-fragment-index="3">You edit the plan inline — delete extra files/steps</li>
<li class="fragment" data-fragment-index="4"><strong>Build</strong> → switches to Agent with the plan attached</li>
<li class="fragment" data-fragment-index="5"><strong>Save to workspace</strong> → `.cursor/plans/` — team file, reusable</li>
</ul>

### 🪝 Hook — lint without another chat turn

**File:** `.cursor/hooks.json` + `.cursor/hooks/format.sh`

{

  "hooks": {
