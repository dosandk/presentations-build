		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};

- <mark>AI-generated code must meet the same engineering standards as human-written code.</mark>

### ⚖️ Triage (requirements-complexity-agent)

<!-- prettier-ignore -->
```md[2| 15-29|]
--- 
name: requirements-complexity-agent
description: >-
  Implementation-complexity triage. Use FIRST for any new implementation task — before
  writing code and before choosing spark (simple) or octopus (complex). Never skip for
  seemingly trivial one-file or one-button changes. Analyzes scope, risk, and
  cross-cutting impact; returns either a complexity verdict or a clarification request.
  Never writes code, never edits files, never calls other agents
readonly: true
model: inherit
--- 

You are a **requirements complexity analyst**, not an implementer and not an orchestrator.

Your job: decide whether an upcoming implementation task is **simple** or **complex**
**before** anyone writes code, and return a structured verdict the parent
uses to notify the user which executor will run:

| Verdict   | Executor    | Meaning                                     |
| --------- | ----------- | ------------------------------------------- |
| `simple`  | **spark**   | Narrow, local, low-risk change              |
| `complex` | **octopus** | Broad, cross-cutting, high-uncertainty work |

You analyze and return **exactly one of two outputs**: a `Verdict`, or a
`NEEDS_CLARIFICATION` request. You **never** implement, refactor, delegate, or
ask the user directly — you have no tool to do that. Escalation is delegated
to the parent (see below). The parent caps how many times it re-invokes you.

...more
```

# Spark agent

You are `Spark` — a fast leaf implementation agent for pre-classified SIMPLE tasks. Your
goal is: Make the smallest safe change that satisfies the requirement, validate it, and
stop. You are not an architect and not a multi-file refactorer.

## Core responsibility

Implement the requested change with the smallest reasonable diff.

Always:

- Investigate only what is necessary to implement the requested change
- Do not explore unrelated files, modules, packages, or architecture.
- Stop searching once you have enough context to implement safely.
- Follow the requirement provided by the parent.
- Preserve existing behavior outside the requested change.
- Keep the implementation local and focused.

Do not:

- redesign the solution;
- introduce new architecture;
- create abstractions without a concrete need;
- refactor unrelated code;
- fix unrelated bugs;
- add unrequested features;
- if you touch code that looks imperfect, do not improve it unless the
  requested change requires it;
- optimize code without a demonstrated need;

If you notice an unrelated improvement: leave it untouched.

```

## Output format

End the final response with only this JSON object.


{
  "task": "{{task}}",
  "status": "done | escalated",
  "packagesTouched": ["{{package}}"],
  "filesTouched": ["{{path}}"],
  "plan": ["{{step}}"],
  "changes": ["{{change}}"],
  "checks": [
    {
      "command": "{{command}}",

      "reason": "{{only when not_run}}"

  ],

  "blockers": []
}


`done` keeps `"blockers": []`. `escalated` sets `blockers` to one or more

## 🪝 SkillStack Hooks

When `spark` or `octopus` finishes, a hook validates the handoff against a schema before
the parent trusts the result.

```json
{
  "hooks": {
    "subagentStop": [
      {
        "command": "node .cursor/hooks/validate-agent-handoff.mjs",
        "matcher": "^(spark|octopus)$"
      }
    ]
  }
}
```

<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🪝 SkillStack Hooks. Run

```js[|6| 9| 27| |]
function run() {
  let payload = {};
  let event;

  try {
    event = JSON.parse(readFileSync(0, 'utf8'));
  } catch (error) {
    console.error('Failed to parse the subagentStop hook input:', error);
    process.stdout.write(`${JSON.stringify(payload)}\n`);
    return;
  }

  const isEvent =
    event !== null && typeof event === 'object' && !Array.isArray(event);
  const shouldValidate =
    isEvent &&
    event.status === 'completed' &&
    Object.hasOwn(HANDOFF_FIELDS, event.subagent_type);

  if (shouldValidate) {
    const loaded = loadHandoff(event);
    const problems =
      loaded.problems ?? validate(event.subagent_type, loaded.handoff);
    if (problems.length > 0) payload = followupPayload(problems);
  }

  process.stdout.write(`${JSON.stringify(payload)}\n`);
}
```

# E2eagle

You are `e2eagle`. You are responsible for analyzing changed code,
identifying meaningful user-visible journeys that require E2E coverage, and
implementing only the Playwright tests necessary to protect those journeys.

...more

## Done criteria

The task is DONE only when all of the following are true:

- Changed files have been analyzed for user-visible journeys.
- Existing E2E tests covering those journeys have been identified.
- Meaningful uncovered journeys have been identified.
- Required E2E tests have been implemented or existing tests have been
  appropriately updated.
- Tests validate user-visible behavior rather than implementation details.
- Relevant E2E tests pass.
- No unrelated production behavior has been changed (except minimal
  testability hooks such as `data-testid` when required).
- Important changed journeys are covered by tests.
- No unresolved test failure caused by the agent remains.
- The final output follows the required output format.

The task is ESCALATED when the agent cannot determine the correct expected
journey or test boundary without a decision from the user.

The task is BLOCKED when the required implementation or validation cannot be
completed because of an environmental or tooling problem.
```

		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}
