	<script type="text/javascript">
		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};


        </script>

### 🎙️ Where you talk to the Agent

Three **surfaces**, one Agent underneath.

|                | IDE                      | Agents Window                      | CLI                          |
| -------------- | ------------------------ | ---------------------------------- | ---------------------------- |
| **What it is** | Code editor + Agent chat | Agent-first workspace _(Cursor 3)_ | Terminal agent — `agent`     |
| **Best for**   | Hands-on coding + review | Orchestrating agents               | Automation, SSH, scripts, CI |
| **Metaphor**   | _edit files_             | _manage runs_                      | _talk to agent in shell_     |

<!-- .element: style="font-size: 2.0rem" -->

notes:

It's the same agent — the only difference is the interface and the use case. Don't mix these up: surfaces are "where the agent lives," while Ask/Plan/Agent/Debug modes (covered next) are available inside every surface. Next: one slide per surface.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

### 🖥️ Surface 1: IDE (classic editor)

The familiar VS Code experience — Agent in the sidebar.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Full editor: splits, extensions, debugger, git UI</li>
<li class="fragment" data-fragment-index="2">Tight loop: edit ↔ chat ↔ accept/reject diffs in place</li>
<li class="fragment" data-fragment-index="3">Default Cursor experience + full ecosystem of VS Code extensions</li>
</ul>

> ✅ Hands-on coding, visual review, co-editing </br>
> ⚠️ Weak at parallel / cloud / multi-repo orchestration

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->

notes:

The main trap of this surface: it's easy to stay "file-first" when the job is actually "steer many agents."
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

Agent-centric UI — local / cloud / SSH agents in one place.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Multi-workspace: agents across repos</li>
<li class="fragment" data-fragment-index="2">Parallel &amp; cloud agents; handoff local ↔ cloud; worktrees</li>
<li class="fragment" data-fragment-index="3">Diffs, commits, PR flow — without leaving the window</li>
</ul>

> ✅ Supervise many runs: prompt → review → merge </br>

What the Agent can do **on its own**:

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1"><strong>Terminal</strong> — run shell commands, monitor output</li>
<li class="fragment" data-fragment-index="2"><strong>Search</strong> — semantic + Instant Grep</li>
<li class="fragment" data-fragment-index="3"><strong>Browser</strong> — open, click, screenshot, read console</li>
<li class="fragment" data-fragment-index="4"><strong>Canvases</strong> — interactive artifacts next to chat</li>
<li class="fragment" data-fragment-index="5"><strong>Worktrees</strong> — isolated git checkouts per task</li>
</ul>

> _No limit on tool calls per task._

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="6" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

### 💻 Tools: Terminal

Agent runs shell commands and reads the output (tests, builds, git).

Shell commands run through a **sandbox** by default — controlled by **run mode**:

| Mode                        | Behavior                             |
| --------------------------- | ------------------------------------ |
| **Auto-review** _(default)_ | allowlist → sandbox → LLM classifier |
| **Allowlist**               | only pre-approved commands auto-run  |
| **Run Everything**          | no sandbox, no prompts — full risk   |

<!-- .element: style="font-size: 2.0rem" -->

> 💡 Tip: Stay on **Auto-review**. Let the Agent run tests, builds, git — approve when it asks.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="1" -->

notes:

The sandbox applies **only to shell / terminal** — not file edits, the browser, or MCP.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🛡️ Tools: Terminal — sandbox limits

What the sandbox blocks by default:

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1"><strong>Network</strong> — blocked (incl. private ranges &amp; cloud metadata)</li>
<li class="fragment" data-fragment-index="2"><strong>Protected paths</strong> — <code>.git/config</code>, <code>.ssh</code>, <code>.cursorignore</code>, hooks</li>
<li class="fragment" data-fragment-index="3">Writes outside the workspace (<code>/tmp</code> allowed)</li>
</ul>

> 💡 Tip: Configure via `.cursor/sandbox.json` — extra paths, network allowlist. Agent **asks for approval** when it needs more.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🔎 Tools: Search

Agent combines search tools as needed:

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1"><strong>Semantic</strong> — "where do we handle authentication?"</li>
<li class="fragment" data-fragment-index="2"><strong>Instant Grep</strong> — exact symbols, regex; faster than ripgrep</li>
<li class="fragment" data-fragment-index="3"><strong>Explore subagent</strong> — parallel searches in a separate context; returns a summary</li>
</ul>

> 💡 Tip: _"Use a subagent to find where Stripe webhooks are handled"_ — you get paths, not 20 files in chat.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->

notes:

Semantic search runs on top of the index. Instant Grep is exact match / regex. The agent often uses both in one task. The Explore subagent is a faster model in its own window: many parallel queries without bloating the main chat. You can ask explicitly: "use a subagent to find…".
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🌐 Tools: Browser

A browser pane **inside Cursor**, fully driven by the Agent.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Navigates, clicks, types, scrolls</li>
<li class="fragment" data-fragment-index="2">Takes screenshots to verify visual changes</li>
<li class="fragment" data-fragment-index="3">Reads console errors, logs, and HTTP</li>
<li class="fragment" data-fragment-index="4"><code>/use-browser</code> — tell the Agent to verify in a real browser</li>
<li class="fragment" data-fragment-index="5"><code>@Browser</code> / <strong>Design Mode</strong> — attach context or send a selected element</li>
</ul>

> 💡 Tip: The Agent can test its own UI changes.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="6" -->

notes:

Scenario: the agent changed the frontend → opened the page → clicked → screenshot/console → fixed it. `/use-browser` forces it to check the UI in the browser, not from the code.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 📊 Tools: Canvases

Live React apps for interactive artifacts next to chat — dashboards, tables, diagrams.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1"><code>/canvas</code> — create one (or just ask)</li>
<li class="fragment" data-fragment-index="2"><strong>Publish</strong> — share a live link with the team</li>
</ul>

> 💡 Tip: _"Show failing tests as a sortable table using /canvas"_ — filter beats a wall of logs.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="3" -->

notes:

Technically these are live React apps (`.canvas.tsx`, `cursor/canvas` SDK): reopen, edit, iterate. The agent can open a canvas itself when a visual beats text. Share / Publish are paid plans; privacy mode has to allow storage.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

### 🌳 Tools: Worktrees

Each task gets its own **git checkout**.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1"><strong>/worktree</strong> — isolate one task</li>
<li class="fragment" data-fragment-index="2"><strong>/best-of-n</strong> — same task, multiple models in parallel</li>
<li class="fragment" data-fragment-index="3"><strong>/apply-worktree</strong> — bring results back</li>
</ul>

> 💡 Tip: Best in the **Agents Window** — supervise parallel runs without leaving that surface.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->

notes:

The basis of parallelization. Most convenient in the Agents Window: you see several runs side by side, without switching back to the IDE. Setup commands for a new worktree live in `.cursor/worktrees.json`. A bridge to Multitask, covered next.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

### 📎 From code to chat

Fastest paths into the conversation:

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Select code → <code>Cmd+L</code> — add selection to chat</li>
<li class="fragment" data-fragment-index="2">Copy anything → <code>Cmd+V</code> in chat — clipboard as context</li>
<li class="fragment" data-fragment-index="3"><code>Cmd+K</code> — inline edit right in the file</li>
<li class="fragment" data-fragment-index="4">Terminal output → <strong>@Terminals</strong></li>
</ul>

> 💡 Tip: Cmd+V in chat also pastes screenshots — browser errors, Figma, failing UI.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="5" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

### 🎚️ Cursor modes

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">🤖 <strong>Agent</strong> <em>(default)</em> — build &amp; execute, all tools</li>
<li class="fragment" data-fragment-index="2">📋 <strong>Plan</strong> — design before coding</li>
<li class="fragment" data-fragment-index="3">💬 <strong>Ask</strong> — explore &amp; understand (read-only)</li>
<li class="fragment" data-fragment-index="4">🐛 <strong>Debug</strong> — hunt hard bugs with runtime logs</li>
<li class="fragment" data-fragment-index="5">⚡ <strong>Multitask</strong> — parallel agents <em>(via Agents Window)</em></li>
</ul>

> 💡 Tip: Switch: `Shift+Tab` in the chat input, or the mode picker.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="6" -->

notes:

Each mode is a different level of AI autonomy. The rule: understand first, then plan, then execute. Multitask is not an item in the mode picker; it's a way of working through the Agents Window and worktrees — covered separately.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 💬 Ask mode

**Read-only.** The AI answers and explores the code, but **makes no changes**.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Explains code, architecture, and errors</li>
<li class="fragment" data-fragment-index="2">Can read git history via a read-only terminal</li>
<li class="fragment" data-fragment-index="3">The safest mode to start with</li>
</ul>

> 🎯 **Best for:** answers, not changes — explore before you edit.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 📋 Plan mode

**Plan** first, then code.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Explores the codebase and asks clarifying questions</li>
<li class="fragment" data-fragment-index="2">Generates an editable plan — review before building</li>
<li class="fragment" data-fragment-index="3">Plans can be saved to the workspace &amp; shared with the team</li>
</ul>

> 🎯 **Best for:** complex features, many files, unclear requirements.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->

notes:

Cursor itself suggests Plan mode when the prompt looks like a complex task. The plan is saved in the home directory or in the workspace ("Save to workspace") — a team artifact.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🤖 Agent mode

The default and most powerful mode — **runs the task to completion**.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Reads and edits files</li>
<li class="fragment" data-fragment-index="2">Runs terminal commands</li>
<li class="fragment" data-fragment-index="3">Searches the codebase and iterates on its own</li>
</ul>

> 🎯 **Best for:** familiar, well-defined tasks — features, refactoring, tests.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🐛 Debug mode

For **hard-to-reproduce** bugs.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Generates multiple root-cause hypotheses</li>
<li class="fragment" data-fragment-index="2">Instruments the app with runtime logs</li>
<li class="fragment" data-fragment-index="3">Uses real runtime data — variables, paths, timing</li>
<li class="fragment" data-fragment-index="4">Fixes the cause, then verifies with you</li>
</ul>

> 🎯 **Best for:** bugs you can't reproduce from the code alone.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="5" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🗺️ Recommended workflow

`Ask` → understood → `Plan` → agreed → `Agent` → done

<!-- .element: class="fragment" data-fragment-index="1" -->

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="2">Complex task → start with <strong>Plan</strong></li>
<li class="fragment" data-fragment-index="3">Simple and familiar → go straight to <strong>Agent</strong></li>
<li class="fragment" data-fragment-index="4">Not sure what the code does → <strong>Ask</strong></li>
</ul>
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### ⚡ Multitask — parallel agents

Several agents on the same problem, **without conflicts**.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Agents Window + worktrees — isolated checkouts per agent</li>
<li class="fragment" data-fragment-index="2"><code>/best-of-n</code> — same task across multiple models</li>
<li class="fragment" data-fragment-index="3"><strong>Multi-Agent Judging</strong> — Cursor evaluates all runs and recommends the best one, with an explanation</li>
</ul>

> 💡 Tip: Parallel runs burn tokens fast — use when the approach is unclear, not for a one-file fix.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->

notes:

After all parallel agents finish, Cursor itself scores the results and comments on why it picked that variant. This mode is obviously expensive.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 📶 Level 4 unlocked — Task-level support

You now: <!-- .element: class="fragment" data-fragment-index="1" -->

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="2">AI daily for small tasks</li>
<li class="fragment" data-fragment-index="3">Pick the mode for the job — <code>Ask</code> / <code>Plan</code> / <code>Agent</code></li>
<li class="fragment" data-fragment-index="4">Let the Agent run its own tools</li>
</ul>

> 🎉 Daily driver, right mode for the job — Task-level, nice work! 🚀

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="5" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🏇 A little faster from here

<div class="block">

Daily driver unlocked. Next: more _granular_ context control.

We'll pick up the pace.
</div>



<!-- .element: style="font-size: 2.0rem" -->

> 🏇 Walked enough. Light gallop to Level 5.

<!-- .element: style="font-size: 2.0rem" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🏷️ Prompting: `@` mentions

Point the Agent at exact context:

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1"><strong>@Files &amp; Folders</strong> — code to work with</li>
<li class="fragment" data-fragment-index="2"><strong>@Terminals</strong> — terminal output as context</li>
<li class="fragment" data-fragment-index="3"><strong>@Past Chats</strong> — reference previous conversation(s)</li>
<li class="fragment" data-fragment-index="4"><strong>@Commit / @Branch</strong> — working-state diff / diff vs main</li>
<li class="fragment" data-fragment-index="5"><strong>@Browser</strong> / <strong>Images</strong> — live pane, or paste / drag (<code>Cmd+V</code>)</li>
</ul>

> 📌 **Rule:** narrow, relevant context beats the whole project.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="6" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### ⚙️ Prompting: `/` commands

`@` adds **context** — `/` triggers an **action**.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1"><strong>/summarize</strong> — compress a long chat, free context</li>
<li class="fragment" data-fragment-index="2"><strong>/worktree</strong> — isolate a risky change in its own checkout</li>
<li class="fragment" data-fragment-index="3"><strong>/use-browser</strong> — verify UI in a real browser</li>
</ul>

> 💡 Tip: Also, via `/`: create & run **Rules**, **Skills**, **Agents**

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🧠 Choosing a model

One picker (`Cmd+/` to cycle), different jobs.

| Need                          | Pick                                     |
| ----------------------------- | ---------------------------------------- |
| Everyday edits, speed & price | **Auto** (Cost / Balance / Intelligence) |
| Deep reasoning, tricky logic  | a **frontier** model                     |
| Huge context / many files     | a **large-context** model                |

<!-- .element: style="font-size: 2.0rem" -->

> 💡 Tip: **Model × Mode:** cheap & fast for `Agent` routine, strongest for `Plan` / `Debug`.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="1" -->

notes:

Auto is a smart default: Cursor Router reads each request and picks a model by task type and complexity. Three Auto modes: Cost (fixed price), Balance, Intelligence. Switch to a more powerful model on purpose only when the task is genuinely hard.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🔄 Switching models mid-chat

You _can_ switch models in the same chat — but it has a cost.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Codebase <strong>index stays</strong> — no re-indexing</li>
<li class="fragment" data-fragment-index="2">Chat <strong>history is re-sent</strong> to the new model from scratch</li>
<li class="fragment" data-fragment-index="3">That usually means <strong>slower + more expensive</strong> turns after the switch</li>
</ul>

> 💡 Tip: Prefer one model per task. Need a different model? Often better to open a **new chat**.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🆕 When to open a new chat

Watch the **context ring** next to the input — when it's full, answers get worse.

| Situation                           | What to do                        |
| ----------------------------------- | --------------------------------- |
| Same task, chat got bloated         | `/summarize` — stay in the thread |
| Want another approach, keep history | **Fork Chat** from a message      |
| New task / new topic / new model    | **New chat**                      |

<!-- .element: style="font-size: 2.0rem" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 📇 Codebase indexing

Cursor builds a **semantic map** of your repo — so Agent can find code by meaning, not only by exact text.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Runs <strong>automatically</strong> in the background</li>
<li class="fragment" data-fragment-index="2">Re-indexes only <strong>what changed</strong></li>
<li class="fragment" data-fragment-index="3">Makes semantic Search and codebase-aware chat work</li>
</ul>

> 💡 Tip: iterating on rules / skills / agents? sometimes **Reindex** — a stale index can feed old (or deleted) versions.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🔐 Indexing & privacy

Good news — most of it works out of the box:

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Cursor already skips the usual noise — <code>node_modules</code>, .lock, binaries, <code>.env</code>, .etc</li>
<li class="fragment" data-fragment-index="2"><strong><code>.gitignore</code></strong> is respected automatically</li>
</ul>
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🔐 Before you start coding

<ol style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Check <strong><code>.cursorignore</code></strong> — secrets &amp; sensitive paths</li>
<li class="fragment" data-fragment-index="2">Check <strong>Privacy Mode</strong> enabled — Cursor Settings → General → Privacy Mode</li>
<li class="fragment" data-fragment-index="3">Follow <strong>ELEKS AI Usage Policy</strong> &amp; approved MCP connectors <em>(Module #1)</em></li>
</ol>
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 📌 Always review AI output

AI is a co-author — **you** ship the code.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Never Accept All blindly — read the <strong>diff</strong>, hunk by hunk</li>
<li class="fragment" data-fragment-index="2">Check intent: does it match the task? edge cases? tests?</li>
<li class="fragment" data-fragment-index="3">Wrong? <strong>Reject</strong> / ask to redo — or <strong>Restore checkpoint</strong> and start over</li>
</ul>
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

You now: <!-- .element: class="fragment" data-fragment-index="1" -->

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="2"><code>@</code> refs — multi-file, codebase-aware context</li>

<li class="fragment" data-fragment-index="4">Review &amp; tweak every change</li>

### ☁️ Cloud Agents

The same Agent, running in **Cursor-managed cloud VMs**.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">Launch from: web (<code>cursor.com/agents</code>), IDE, iOS, Slack, Teams, GitHub, API</li>
<li class="fragment" data-fragment-index="2">Full dev environment: clones repo, installs deps, runs tests</li>
<li class="fragment" data-fragment-index="3">Delivers <strong>merge-ready PRs</strong> with artifacts</li>
<li class="fragment" data-fragment-index="4">Runs in parallel — doesn't depend on your machine</li>
</ul>

> _Example: a ticket from Slack / `@cursor` on GitHub → agent implements, tests, opens a PR._

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="5" -->

notes:

The key difference from a local agent: its own isolated environment with network, secrets, and startup commands — it can build and test on its own. Typical scenario: you delegated a task from your phone or Slack → you got a ready PR. Previously called Background Agents.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### ⏰ Automations

Cloud agents that run **without you** — on a schedule or on events.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1"><strong>Schedule</strong> — cron / hourly / daily</li>
<li class="fragment" data-fragment-index="2"><strong>Events</strong> — PR &amp; push, Slack messages, Linear issues, Sentry errors, PagerDuty incidents, webhooks</li>
<li class="fragment" data-fragment-index="3"><strong>Setup</strong>: trigger → plain-language instructions → tools → repo scope</li>
</ul>

> 📌 **Rule:** Cloud Agent = you start it. Automation = a trigger starts it.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->

notes:

Created at cursor.com/automations or with the /automate command. Billing is cloud-agent usage. Examples: review recent commits for bugs, weekly codebase-change summary, triage bugs from Slack.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🔒 Security agents

Two Cursor-managed agents on Cloud Agents infra:

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1"><strong>Security Reviewer</strong> — checks every PR for vulnerabilities <em>before merge</em></li>
<li class="fragment" data-fragment-index="2"><strong>Vulnerability Scanner</strong> — scans the codebase at rest, on a schedule</li>
<li class="fragment" data-fragment-index="3">Custom instructions, per-team checks, posts to Slack / issue trackers</li>
</ul>

> 💡 Tip: Can still run them locally (`/review-security`) if not enabled for the team.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="4" -->

notes:

Zero extra setup — they run on top of Cloud Agents. There is analytics: vulnerabilities found, time to fix, resolution rate. Manual counterparts are /review-security and /review right in the agent.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🔍 Bugbot

Automated **code review** on every pull request.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1">GitHub, GitLab, Bitbucket, Azure DevOps</li>
<li class="fragment" data-fragment-index="2">Inline comments: bug + severity + suggested fix + "Fix in Cursor" link</li>
<li class="fragment" data-fragment-index="3">Guided by team rules and <code>.cursor/BUGBOT.md</code></li>
<li class="fragment" data-fragment-index="4"><strong>Autofix</strong> — spawns a Cloud Agent to fix found issues</li>
</ul>

> 💡 Tip: Can still run locally (`/review`) if not enabled for the team.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="5" -->

notes:

Triggers automatically on every PR update, manually via a `cursor review` / `bugbot run` comment, or incrementally (new changes only). Two thoroughness levels: Default and High. It reads existing PR comments so it doesn't duplicate them.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

_One example_ — also Slack, Jira, Linear, GitLab, Bitbucket, etc.

<!-- .element: class="fragment" data-fragment-index="1" -->

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="2"><strong>GitHub</strong> — the hub: Cloud Agents, Bugbot, PR create &amp; review</li>
<li class="fragment" data-fragment-index="3">Comment <code>@cursor</code> on a PR or issue → agent picks it up</li>
<li class="fragment" data-fragment-index="4"><strong>Microsoft Teams</strong> — <code>@Cursor</code> in chats &amp; channels</li>
<li class="fragment" data-fragment-index="5">Launch agents, pick repo/model, get PR links; thread-aware follow-ups</li>
</ul>

> 💡 Tip: Start with **GitHub** — it unlocks Cloud Agents, Bugbot, and PRs.

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="6" -->

notes:

The GitHub integration uses least-privilege permissions and supports GitHub Enterprise Server. Teams: install via the dashboard or Microsoft Marketplace; you can pick the repo (`repo=`), env, and Privacy Mode. The same kind of integration exists for Slack, Jira, Linear, GitLab, and Bitbucket.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 800px; width: 1600px; min-height: 800px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### 🚦 PR Routing & Approval

An approval agent that **routes and gates** pull requests.

<ul style="font-size: 2.0rem">
<li class="fragment" data-fragment-index="1"><strong>Triggers</strong> — PR opened / updated / commented</li>
<li class="fragment" data-fragment-index="2"><strong>Signals</strong> — Bugbot, Security, risk score</li>
<li class="fragment" data-fragment-index="3"><strong>Rules</strong> — custom prompt + <code>APPROVAL_POLICY.md</code></li>
<li class="fragment" data-fragment-index="4"><strong>Tools</strong> — request reviewers, approve; Slack / Teams / MCP</li>
</ul>

> _Example: Assigns reviewers → auto-approves low-risk → else humans decide_

<!-- .element: style="font-size: 2.0rem" class="fragment" data-fragment-index="5" -->

notes:

A Cursor-managed agent on Automations (like Bugbot and Security), not an integration. Signals: it waits for Bugbot/Security if they are enabled; their findings block auto-approve. Policy files in the repo take priority over a custom prompt. At least one primary action is required: Request Reviewers or Approve PR.

      function extend() {
        var target = {};
        for (var i = 0; i < arguments.length; i++) {
          var source = arguments[i];
          for (var key in source) {
            if (source.hasOwnProperty(key)) {
              target[key] = source[key];
            }
          }
        }
        return target;
      }

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}

	var bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
	var isLight = isLight(bgColor);

	if(isLight){
		document.body.classList.add('has-light-background');
	} else {
		document.body.classList.add('has-dark-background');
	}
