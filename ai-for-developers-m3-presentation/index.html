		var forgetPop = true;
		function onPopState(event) {
			if(forgetPop){
				forgetPop = false;
			} else {
				parent.postMessage(event.target.location.href, "app://obsidian.md");
			}
        }
		window.onpopstate = onPopState;
		window.onmessage = event => {
			if(event.data == "reload"){
				window.document.location.reload();
			}
			forgetPop = true;
		}

		function fitElements(){
			const itemsToFit = document.getElementsByClassName('fitText');
			for (const item in itemsToFit) {
				if (Object.hasOwnProperty.call(itemsToFit, item)) {
					var element = itemsToFit[item];
					fitElement(element,1, 1000);
					element.classList.remove('fitText');
				}
			}
		}

		function fitElement(element, start, end){

			let size = (end + start) / 2;
			element.style.fontSize = `${size}px`;

			if(Math.abs(start - end) < 1){
				while(element.scrollHeight > element.offsetHeight){
					size--;
					element.style.fontSize = `${size}px`;
				}
				return;
			}

			if(element.scrollHeight > element.offsetHeight){
				fitElement(element, start, size);
			} else {
				fitElement(element, size, end);
			}		
		}


		document.onreadystatechange = () => {
			fitElements();
			if (document.readyState === 'complete') {
				if (window.location.href.indexOf("?export") != -1){
					parent.postMessage(event.target.location.href, "app://obsidian.md");
				}
				if (window.location.href.indexOf("print-pdf") != -1){
					let stateCheck = setInterval(() => {
						clearInterval(stateCheck);
						window.print();
					}, 250);
				}
			}
	};

### From prompt to rule

**🔴 prompt** <!-- .element: style="font-size: 1.8rem" -->

```md
You are a senior frontend developer. Implement this task  
without bugs, follow best practices, write clean, scalable, and maintainable code.

```md
---  
description: Frontend implementation guidelines
alwaysApply: true
---  

- Follow existing project patterns and conventions.
- Reuse existing components, hooks, utilities, and services before creating new ones.
- Prefer simple solutions over unnecessary abstractions.
- Keep UI, business logic, and data access separated.
- Preserve existing behavior unless the task explicitly requires a change.
- Do not introduce new dependencies unless there is a clear requirement.
- Add or update tests when changing existing behavior.
- Remove unused code, imports, and debug statements before completing the task.
```

### How rules activate

<div class="block">

| Rule Type               | Applied when...                                  |
| :---------------------- | ------------------------------------------------ |
| Always Apply            | Every chat session                               |
| Apply Intelligently     | Agent decides it's relevant based on description |
| Apply to Specific Files | A file matches a specified glob pattern          |
| Apply Manually          | You `@-mention` it in chat (e.g., `@my-rule`)    |

</div>

### How rules activate

Under the hood, three frontmatter fields decide when a rule is included:

<div class="block">

| alwaysApply | description | globs    | Behavior                                                         |
| :---------- | :---------- | :------- | :--------------------------------------------------------------- |
| `true`      | -           | -        | Always included. `globs` and `description` are ignored.          |
| `false`     | -           | Provided | Auto-attached when a matching file is in context.                |
| `false`     | Provided    | Omitted  | Agent reads the description and pulls the rule in when relevant. |
| `false`     | Omitted     | Omitted  | Included only when you `@-mention` the rule in chat.             |

</div>

<!-- .element: style="font-size: 1.8rem" -->

`alwaysApply: false` - default behavior

### Project rules: file structure

Project rules live in `.cursor/rules` as `.mdc` files and are version-controlled.

```
.cursor/rules/
  react-patterns.mdc       # Recognized as a project rule
  api-guidelines.md        # Ignored (wrong extension)
  frontend/                # Organize rules in folders
    components.mdc
```

A plain `.md` file has no frontmatter, so the rules system ignores it.

### Glob patterns

Scope a rule to the files it should apply to:

<div class="block">

| Pattern                       | Matches                               |
| :---------------------------- | :------------------------------------ |
| `*`                           | Any single file-name segment          |
| `**`                          | Any number of directories (recursive) |
| `**/*.ts`                     | All `.ts` files in any directory      |
| `src/**/*.tsx`                | All `.tsx` files under `src/`         |
| `docs/**/*.md, docs/**/*.mdx` | Multiple patterns (comma-separated)   |

</div>

### Precedence & Nested Rules

When several rules apply, they are all **merged** - earlier sources win on conflict:

`Team Rules` --> `Project Rules` --> `User Rules`

- Nested `AGENTS.md` combine with parent directories
- More specific (deeper) instructions take precedence

### What good rules contain

Rules are where you encode your **persistent conventions**:

- Coding principles you always follow — **SOLID**, **DRY**, **KISS**, **YAGNI**, avoid
  premature optimization
- Team best practices and do's / don'ts

<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### What are hooks?

> Hooks let you **observe, control, and extend** the agent loop with custom scripts or LLM
> checks.

- Run **before or after** defined stages of the agent lifecycle
- Exchange **JSON over stdin/stdout** with spawned processes
- Can **allow**, **deny**, **ask**, rewrite input, or inject context

notes:

Hooks — це не React hooks і не git hooks. Це механізм Cursor для перехоплення подій
агента.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Where hooks fit

- **Rules** - persistent guidance injected into context
- **Skills** - reusable workflows the agent pulls in when relevant
- **Hooks** - runtime gates and automation around agent events
  - Format files after edits
  - Block risky shell commands
  - Audit tool usage
  - Scan prompts for secrets
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Three hook surfaces

Cursor separates hooks by **what triggers them**:

<div class="block">

| Surface           | Examples                                              | Typical use                                 |
| :---------------- | :---------------------------------------------------- | :------------------------------------------ |
| **Agent**         | `beforeShellExecution`, `afterFileEdit`, `preToolUse` | Gate terminal/MCP calls, post-process edits |
| **Tab**           | `beforeTabFileRead`, `afterTabFileEdit`               | Redact secrets, format inline completions   |
| **App lifecycle** | `workspaceOpen`                                       | Load plugins or bootstrap workspace state   |

</div>

<!-- .element: style="font-size: 1.8rem" -->

notes:

Agent hooks — основний фокус презентації. Tab hooks — для автономного Tab, не Agent Chat.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### How hooks work

```text
Agent event fires
      ↓
Cursor reads hooks.json
      ↓
Hook script receives JSON on stdin
      ↓
Script returns JSON on stdout (or exit code)
      ↓
Cursor allows, blocks, asks, or continues
```

- Config reloads automatically when `hooks.json` changes
- Debug via **Settings → Hooks** or the **Hooks** output channel
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Where hooks live

<div class="block">

| Scope       | Config                 | Scripts             | Best for                                      |
| :---------- | :--------------------- | :------------------ | :-------------------------------------------- |
| **Project** | `.cursor/hooks.json`   | `.cursor/hooks/*`   | Team standards, version-controlled guardrails |
| **User**    | `~/.cursor/hooks.json` | `~/.cursor/hooks/*` | Personal automation across all projects       |

</div>

<!-- .element: style="font-size: 1.8rem" -->

**Path rule:** project hooks run from the **repo root** — use `.cursor/hooks/format.sh`,
not `./hooks/format.sh`.

notes:

Cloud agents load **project** hooks from the repo, not user-level `~/.cursor/hooks.json`.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

### hooks.json schema

</div>



</div>
<div class="container-body">
<div class="container-body-left">
<div class="block">

Every project-level config needs `"version": 1`:

<!-- prettier-ignore -->
```json
{
  "version": 1,
  "hooks": {
    "afterFileEdit": [
      {
        "command": ".cursor/hooks/format.sh"
      }
    ],
    "beforeShellExecution": [
      {
        "command": ".cursor/hooks/approve-network.sh",
        "matcher": "curl|wget|nc ",
        "timeout": 10,
        "failClosed": true
      }
    ]
  }
}
```

</div>



</div>
<div class="container-body-right">
<div class="block">

<!-- prettier-ignore -->
| Field        | Purpose                                          |
| :----------- | :----------------------------------------------- |
| `command`    | Script or shell command to run                   |
| `type`       | `"command"` (default) or `"prompt"`              |
| `matcher`    | Optional regex filter — run only when it matches |
| `timeout`    | Max seconds before the hook is killed            |
| `failClosed` | If `true`, failure/timeout **blocks** the action |

</div>

<!-- .element: style="font-size: 1.5rem" -->

</div>
</div>









</div>

<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Hook types

#### Command-based (default)

Deterministic scripts — best for auditable, exact behavior.

<!-- prettier-ignore -->
```json
{
  "beforeShellExecution": [{
    "command": ".cursor/hooks/approve-network.sh",
    "timeout": 30,
    "matcher": "curl|wget"
  }]
}
```

#### Prompt-based

LLM evaluates a natural-language policy — quick to set up, less deterministic.

<!-- prettier-ignore -->
```json
{
  "beforeShellExecution": [{
    "type": "prompt",
    "prompt": "Does this command look safe? Only allow read-only operations. Input: $ARGUMENTS",
    "timeout": 10
  }]
}
```

notes:

Prompt hooks are **not** available in cloud agents — command hooks only.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Agent hook events

<div class="block">

| Lifecycle        | Events                                            |
| :--------------- | :------------------------------------------------ |
| Session          | `sessionStart`, `sessionEnd`                      |
| Tools (generic)  | `preToolUse`, `postToolUse`, `postToolUseFailure` |
| Subagents        | `subagentStart`, `subagentStop`                   |
| Shell            | `beforeShellExecution`, `afterShellExecution`     |
| MCP              | `beforeMCPExecution`, `afterMCPExecution`         |
| Files            | `beforeReadFile`, `afterFileEdit`                 |
| Prompt & context | `beforeSubmitPrompt`, `preCompact`                |
| Completion       | `stop`, `afterAgentResponse`, `afterAgentThought` |

</div>

<!-- .element: style="font-size: 1.8rem" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Pick the narrowest event

Use the **smallest hook surface** that solves the problem:

<div class="block">

| Goal                              | Event                  |
| :-------------------------------- | :--------------------- |
| Block or approve shell commands   | `beforeShellExecution` |
| Audit shell output                | `afterShellExecution`  |
| Format files after agent edits    | `afterFileEdit`        |
| Block or rewrite any tool call    | `preToolUse`           |
| Add context after a tool succeeds | `postToolUse`          |
| Control subagent (Task) execution | `subagentStart`        |
| Chain subagent follow-up loops    | `subagentStop`         |
| Scan prompts for secrets / policy | `beforeSubmitPrompt`   |
| Gate MCP tool calls               | `beforeMCPExecution`   |

</div>

<!-- .element: style="font-size: 1.8rem" -->

notes:

Prefer `beforeShellExecution` over `preToolUse` when you only care about terminal
commands.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Matchers

Run hooks only when they matter — matchers use **JavaScript regex**, not POSIX/grep.

<div class="block">

| Event family                     | Matcher matches                                         |
| :------------------------------- | :------------------------------------------------------ |
| `beforeShellExecution`           | Full shell command string                               |
| `preToolUse` / `postToolUse`     | Tool type: `Shell`, `Read`, `Write`, `Task`, `MCP: ...` |
| `subagentStart` / `subagentStop` | Subagent type: `generalPurpose`, `explore`, …           |
| `afterFileEdit`                  | Tool type: `Write` or `TabWrite`                        |
| `beforeSubmitPrompt`             | Value `UserPromptSubmit`                                |

</div>

<!-- .element: style="font-size: 1.8rem" -->

> Start **without** a matcher, confirm the hook fires, then tighten the filter.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Hook responses

Return only fields supported by the event:

<div class="block">

| Event                                        | Key stdout fields                                                      |
| :------------------------------------------- | :--------------------------------------------------------------------- |
| `beforeShellExecution`, `beforeMCPExecution` | `permission`: `allow` · `deny` · `ask`, plus optional messages         |
| `preToolUse`                                 | `permission`, `updated_input` to rewrite the tool call                 |
| `postToolUse`                                | `additional_context`; MCP tools also support `updated_mcp_tool_output` |
| `subagentStart`                              | `permission`, `user_message`                                           |
| `subagentStop`                               | `followup_message`                                                     |
| `sessionStart`                               | `additional_context`                                                   |

</div>

<!-- .element: style="font-size: 1.8rem" -->

**Exit codes:** `0` = success · `2` = block (same as `deny`) · other = fail-open unless
`failClosed: true`
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Example: auto-format after edits

`.cursor/hooks.json`

<!-- prettier-ignore -->
```json
{
  "version": 1,
  "hooks": {
    "afterFileEdit": [{
      "command": ".cursor/hooks/format.sh",
      "matcher": "Write"
    }]
  }
}
```

`.cursor/hooks/format.sh`

<!-- prettier-ignore -->
```bash
#!/bin/bash
input=$(cat)
file_path=`$(echo "$`input" | jq -r '.file_path // empty')
 -z "$file_path"  && exit 0
npx prettier --write "$file_path" 2>/dev/null
exit 0
```
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Example: gate network commands

<!-- prettier-ignore -->
```bash
#!/bin/bash
input=$(cat)
command=`$(echo "$`input" | jq -r '.command // empty')

if wget|nc ; then
  echo '{
    "permission": "ask",
    "user_message": "This command may make a network request. Review before continuing.",
    "agent_message": "A hook flagged this as a possible network call."
  }'
  exit 0
fi

echo '{ "permission": "allow" }'
exit 0
```

Set `"failClosed": true` when a crashed hook should **deny** by default.
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->
<div class="" style="position: absolute; left: 0px; top: 0px; height: 900px; width: 1440px; min-height: 900px; display: flex; flex-direction: column; align-items: center; justify-content: center" absolute="true">

### Example: audit log

Fire-and-forget logging — read stdin, write to a log, always exit 0:

<!-- prettier-ignore -->
```bash
#!/bin/bash
json_input=$(cat)
timestamp=$(date '+%Y-%m-%d %H:%M:%S')
echo "[`$timestamp] $`json_input" >> /tmp/agent-audit.log
exit 0
```

Attach the same script to multiple events: `beforeShellExecution`, `afterFileEdit`,
`stop`, …

<div class="block">

**Use hooks when:**

<ul style="font-size: 1.8rem">

</div>

**Use rules/skills when:**

<ul style="font-size: 1.8rem">

</ul>

</div>

### Best practices

<div class="block">

- Choose the **narrowest event** (`beforeShellExecution` > `preToolUse`)
- Make scripts **executable** (`chmod +x`) and verify dependencies (`jq`, `node`, …)
- Start simple — no matcher first, then add filtering
- Set `failClosed: true` for security-sensitive gates
- Keep scripts **fast** — hooks block the agent loop
- Return **valid JSON** only; test with the real event, not mocks alone

</div>



<!-- .element: style="font-size: 2rem" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

### Troubleshooting

<div class="block">

| Symptom                        | Check                                                                      |
| :----------------------------- | :------------------------------------------------------------------------- |
| Hook never fires               | `"version": 1` present? Paths relative to project root? Script executable? |
| Hook fires too often           | Tighten the `matcher`; verify JS regex syntax                              |
| Hook crashes silently          | Open **Hooks** output channel; add logging to `/tmp/hooks.log`             |
| Action still proceeds on error | Set `"failClosed": true` or return exit code `2` to block                  |
| Changes ignored                | Save `hooks.json` — Cursor reloads on save; restart if needed              |

</div>



<!-- .element: style="font-size: 1.8rem" -->
</div></script></section><section data-markdown><script type="text/template"><!-- .slide: class="drop" -->

            }
          }
        }
        return target;
      }

	  function isLight(color) {
		let hex = color.replace('#', '');

		// convert #fff => #ffffff
		if(hex.length == 3){
			hex = `${hex[0]}${hex[0]}${hex[1]}${hex[1]}${hex[2]}${hex[2]}`;
		}

		const c_r = parseInt(hex.substr(0, 2), 16);
		const c_g = parseInt(hex.substr(2, 2), 16);
		const c_b = parseInt(hex.substr(4, 2), 16);
		const brightness = ((c_r * 299) + (c_g * 587) + (c_b * 114)) / 1000;
		return brightness > 155;
	}

	var bgColor = getComputedStyle(document.documentElement).getPropertyValue('--r-background-color').trim();
	var isLight = isLight(bgColor);

	if(isLight){
		document.body.classList.add('has-light-background');
	} else {
		document.body.classList.add('has-dark-background');
	}
